[project]
name = "starcoach"
version = "1.0.0"
description = "A Liara website assistant: deploy, monitor, diagnose, fix — with your approval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
starcoach = "starcoach.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E741"]
